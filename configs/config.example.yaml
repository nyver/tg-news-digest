# Пример конфигурации Telegram News Digest Bot
# Скопируйте в config.yaml и заполните значения

bot:
  token: "YOUR_BOT_TOKEN_HERE"  # Получите от @BotFather
  parse_mode: "HTML"            # HTML или MarkdownV2
  owner_chat_id: 0              # Ваш Telegram chat_id для команд администратора
  mtproxy:
    enabled: false              # Включить использование MTProxy
    host: "example.com"         # Адрес MTProxy-сервера
    port: 443                   # Порт MTProxy-сервера (по умолчанию 443)
    secret: ""                  # Base64-кодированный секрет прокси (необязательно)

rss:
  feeds:
    - "https://rsshub.app/telegram/channel/durov"
    - "https://rsshub.app/telegram/channel/meduzanews"
    # Локальные RSS-файлы также поддерживаются (путь относительно cwd):
    # - "./data/rss/local-feed.xml"
  max_items_per_feed: 50        # Макс. элементов на одну ленту
  fetch_timeout: 15s            # Таймаут запроса RSS (только для HTTP)
  cache_ttl: 24h                # TTL кэша дедупликации

llm:
  # Provider: "llama-cpp" (local llama.cpp) or "openrouter"
  # Для llama-cpp: endpoint обязателен, api_key опционален
  # Для openrouter: endpoint не используется (https://openrouter.ai/api/v1), api_key обязателен
  provider: "llama-cpp"
  endpoint: "http://host.docker.internal:8080"
  model: "llama-3-8b-instruct-Q5_K_M"
  api_key: ""
  temperature: 0.3
  max_tokens: 2000
  context_window: 8192
  timeout: 60s

# Пример для OpenRouter:
# llm:
#   provider: "openrouter"
#   model: "meta-llama/llama-3.1-8b-instruct"
#   api_key: "sk-or-v1-..."  # Ваш OpenRouter API ключ
#   temperature: 0.3
#   max_tokens: 2000
#   context_window: 8192
#   timeout: 60s

schedule:
  cron: "* * * * *"             # How often to check subscribers whose delivery_time is due
  timezone: "Europe/Moscow"

# Категории для классификации новостей (LLM + keyword-фоллбэк).
# Используются в /categories (выбор подписчиком) и в /digest <тема>.
categories:
  - "Большие языковые модели"
  - "Генеративный ИИ"
  - "Научные исследования и публикации"
  - "Open Source модели"
  - "Машинное обучение и инструменты"
  - "Компьютерное зрение"
  - "Обработка естественного языка"
  - "ИИ-агенты и автоматизация"
  - "Робототехника"
  - "ИИ в продуктах и сервисах"
  - "Бизнес и стартапы"
  - "Аппаратное обеспечение и инфраструктура"
  - "Корпоративные новости"
  - "Регулирование и право"
  - "Этика и безопасность ИИ"
  - "Влияние на общество и рынок труда"
  - "Разработка и программирование"
  - "Мнения и аналитика"

app:
  db_path: "./data/bot.db"
  log_level: "info"             # debug, info, warn, error
  retry_max: 3
  retry_backoff: 2s
  digest_log_path: "./data/bot.log"
  health_host: "127.0.0.1"      # HTTP bind host; use "0.0.0.0" in Docker
  dashboard_token: ""           # Bearer token for /dashboard; empty allows localhost only
  health_port: 9100             # Порт HTTP-эндпоинта healthcheck
  digest_top_n: 10              # Количество новостей в ежедневном дайджесте
  fetched_items_retention_days: 3  # Хранить fetched_items не дольше N дней (housekeeping)
